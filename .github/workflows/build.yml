# Проверка и веб-версия CRAFT Посты.
# - Любой пуш: анализ кода, тесты, сборка веб-версии (архив в Artifacts).
# - Пуш в main: веб-версия публикуется на GitHub Pages (ветка gh-pages).
# APK собирается отдельно и только по запросу — см. apk.yml.
name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Быстрая проверка при каждой правке: анализ кода и тесты (без сборки APK).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: ./tool/setup_web.sh
      - run: flutter pub get
      - run: flutter build web --release --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: craft-post-web
          path: build/web
      - name: Опубликовать на GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true

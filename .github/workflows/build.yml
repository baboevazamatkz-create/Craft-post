# Сборка приложения CRAFT Посты.
# - Любой пуш: проверки, тесты, APK и веб-версия (архивы в Artifacts).
# - Пуш в main: веб-версия публикуется на GitHub Pages (ветка gh-pages).
name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: ./tool/setup_android.sh
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Загрузка Gradle/NDK иногда обрывается — повторяем до 3 раз.
      - run: |
          for i in 1 2 3; do
            flutter build apk --release && exit 0
            echo "Сборка не удалась (попытка $i), повтор"; sleep 10
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: craft-post-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: ./tool/setup_web.sh
      - run: flutter pub get
      - run: flutter build web --release --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: craft-post-web
          path: build/web
      - name: Опубликовать на GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true

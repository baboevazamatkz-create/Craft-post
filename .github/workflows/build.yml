# Сборка приложения CRAFT Посты.
# - Любой пуш: проверки, тесты, APK и веб-версия (архивы в Artifacts).
# - Пуш в main: веб-версия публикуется на GitHub Pages (ветка gh-pages).
name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: ./tool/setup_android.sh
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Постоянная подпись: одна и та же у всех сборок, поэтому новая версия
      # ставится поверх старой и ключ AI с историей постов сохраняются.
      - name: Подпись APK из секретов
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Секреты подписи не заданы: APK подписан временным ключом и не встанет поверх прошлой версии"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload.p12
          printf 'storeFile=upload.p12\nstorePassword=%s\nkeyAlias=craft\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties
      # Загрузка Gradle/NDK иногда обрывается — повторяем до 3 раз.
      - run: |
          for i in 1 2 3; do
            flutter build apk --release && exit 0
            echo "Сборка не удалась (попытка $i), повтор"; sleep 10
          done
          exit 1
      - name: Отпечаток подписи APK
        run: keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep -E "Owner|SHA256" || true
      - uses: actions/upload-artifact@v4
        with:
          name: craft-post-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: ./tool/setup_web.sh
      - run: flutter pub get
      - run: flutter build web --release --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: craft-post-web
          path: build/web
      - name: Опубликовать на GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true

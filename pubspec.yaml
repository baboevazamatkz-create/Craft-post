name: craft_post
description: Автоматизация постов Instagram для CRAFT SYSTEM.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  image_picker: ^1.1.2
  gal: ^2.3.0
  http: ^1.2.2
  image: ^4.2.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  path_drawing: ^1.0.1
  cross_file: ^0.3.4
  idb_shim: ^2.6.1
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/overlays/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: Cormorant
      fonts:
        - asset: assets/fonts/CormorantSC-Light.ttf
          weight: 300
        - asset: assets/fonts/CormorantSC-Regular.ttf
          weight: 400
